name: Update KAM Dashboard Data

on:
  schedule:
    - cron: "0 */3 * * *"   # cada 3 horas
  workflow_dispatch: {}       # permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Generar data.json desde Google Sheets
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python scripts/update_data.py

      - name: Commitear data.json y sin_asignar.json si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json sin_asignar.json
          git diff --staged --quiet || git commit -m "chore: actualizar data.json [skip ci]"
          git push
